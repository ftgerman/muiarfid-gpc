<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos GPC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background: #ffd1dc;
      color: #202938;
      font-family: Arial, sans-serif;
    }
    main { width: min(100%, 760px); }
    header { margin-bottom: 28px; }
    .asignatura {
      margin: 0 0 12px;
      color: #694654;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.12em;
    }
    h1 { margin: 0 0 10px; font-size: clamp(30px, 5vw, 42px); letter-spacing: -0.04em; }
    .descripcion { margin: 0; color: #694654; line-height: 1.6; }

    /* Cada tarjeta es un enlace completo, también accesible con el teclado. */
    .proyectos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .proyecto {
      display: flex;
      flex-direction: column;
      min-height: 260px;
      padding: 28px;
      border: 1px solid #ebc1cc;
      border-top: 4px solid var(--acento);
      border-radius: 14px;
      background: white;
      color: inherit;
      text-decoration: none;
    }
    .hockey { --acento: #245bd6; }
    .robot { --acento: #a63e63; }
    .numero { color: #697180; font-size: 13px; }
    h2 { margin: 30px 0 10px; font-size: 26px; letter-spacing: -0.02em; }
    .detalle { margin: 0 0 28px; color: #596273; font-size: 14px; line-height: 1.6; }
    .abrir {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid #edf0f4;
      color: var(--acento);
      font-size: 14px;
      font-weight: bold;
    }
    .proyecto:hover { background: #fff9fb; border-color: var(--acento); }
    .proyecto:focus-visible { outline: 3px solid var(--acento); outline-offset: 5px; }
    @media (max-width: 560px) {
      body { padding: 32px 20px; }
      .proyectos { grid-template-columns: 1fr; gap: 16px; }
      .proyecto { min-height: 225px; padding: 24px; }
      h2 { margin-top: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="asignatura">MUIARFID · GRÁFICOS POR COMPUTADOR</p>
      <h1>Proyectos GPC</h1>
      <p class="descripcion">Germán Soria Bustos</p>
    </header>
    <nav class="proyectos" aria-label="Proyectos">
      <a class="proyecto hockey" href="./webgl/index.html">
        <span class="numero" aria-hidden="true">01</span>
        <h2>Hockey mesa</h2>
        <p class="detalle">Hockey en 3D para dos jugadores.</p>
        <span class="abrir">Abrir proyecto <span aria-hidden="true">→</span></span>
      </a>
      <a class="proyecto robot" href="./webgl/robot.html">
        <span class="numero" aria-hidden="true">02</span>
        <h2>Robot</h2>
        <p class="detalle">Proyecto en desarrollo.</p>
        <span class="abrir">Abrir proyecto <span aria-hidden="true">→</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
